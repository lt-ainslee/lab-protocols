# 在 GitHub 上跑一遍 Cloudflare 构建会跑的步骤，失败时日志直接显示在 PR 里。
# Cloudflare 的 Workers Builds 检查失败时 GitHub 上看不到日志（见 CLAUDE.md）：
# 这里通过而 Cloudflare 失败，多半是 Cloudflare 侧的问题，再去控制台看日志。
name: CI

on:
  pull_request:
  push:
    branches: [main, experimental]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: 构建站点（npm run build）
        run: npm run build
      - name: 检查 Worker 类型（npm run typecheck）
        run: npm run typecheck
      # 会按 wrangler.jsonc 的 build.command 再构建一次，并检查 dist/、绑定和 Worker 打包
      - name: 模拟部署（wrangler deploy --dry-run）
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-out"
